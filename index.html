<!DOCTYPE html>
<html lang="pt-BR">
<head>

<link rel="stylesheet" href="/src/css/style.css">
<title>1º Aninho do Benjamin</title>
</head>
<body>

<!-- Tela de Abertura -->
<div id="splash-screen">
  <div class="cloud cloud-1"></div>
  <div class="cloud cloud-2"></div>
  <div class="cloud cloud-3"></div>
  <span class="star star-1">✦</span>
  <span class="star star-2">★</span>
  <span class="star star-3">✦</span>
  <span class="star star-4">✦</span>

  <div class="splash-card">
    <span class="badge-tag">✨ Um momento especial se aproxima</span>
    <h1 class="splash-title">1º Aninho do Benjamin!</h1>
    <p class="splash-subtitle">
      "Por este filho nós orávamos e o Senhor ouviu nossa oração."<br>
      <small style="color: #64748b; font-style: italic;">— 1 Samuel 1:27</small>
    </p>

    <button class="btn-open-invite" onclick="revelarConvite('')">
      <span>Abra o Convite</span> 🩵
    </button>
  </div>
</div>

<!-- Script para acionar a transição -->
<script src="src/script.js"></script>
